# Publie le site sur GitHub Pages.
# - à chaque push sur main, et toutes les heures pour rafraîchir les données GitHub ;
# - génère data/github.json (dépôts, releases, commits) : les visiteurs ne touchent plus à l'API GitHub ;
# - régénère le dictionnaire anglais et les numéros de version des fichiers CSS/JS,
#   donc plus besoin de lancer ces scripts à la main avant de pousser.
name: Déploiement du site

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # historique complet : dates du sitemap

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Données GitHub (dépôts, releases, commits)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/update-downloads-data.py

      - name: Dictionnaire anglais, versions des fichiers CSS/JS et dates du sitemap
        run: |
          python tools/build_i18n.py
          python tools/version_assets.py
          python tools/update_sitemap.py

      - name: CV en PDF (français, anglais ; fond blanc, noir)
        run: |
          python -m http.server 8765 --bind 127.0.0.1 &
          sleep 2
          for l in fr en; do
            for s in light dark; do
              out="cv-$l.pdf"
              if [ "$s" = dark ]; then out="cv-$l-dark.pdf"; fi
              google-chrome --headless=new --no-sandbox --disable-gpu --no-pdf-header-footer --virtual-time-budget=8000 --print-to-pdf="$out" "http://127.0.0.1:8765/cv.html?lang=$l&style=$s"
              test -s "$out"
            done
          done

      - name: Fichiers publiés
        run: rsync -a --exclude .git --exclude .github ./ _site/

      - uses: actions/upload-pages-artifact@v5

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
